name: 构建浪神融合版 IPA v20

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 选源码包并解压
        id: pick
        shell: bash
        run: |
          set -e
          echo "===== 仓库根目录 ====="
          ls -la

          ZIPS=$(ls -1 2>/dev/null | grep -E '^(LSPakManager-Source|3105-Source)-.*\.zip$' || true)
          echo "根目录发现的源码包："
          echo "${ZIPS:-  （一个都没有）}"

          CANDIDATES="LSPakManager-Source-v20.0.zip"
          if [ -n "$ZIPS" ]; then
            for f in $(printf '%s\n' "$ZIPS" | sort -r); do
              CANDIDATES="$CANDIDATES $f"
            done
          fi

          ZIP=""
          for f in $CANDIDATES; do
            [ -f "$f" ] || continue
            if ! unzip -l "$f" 2>/dev/null | grep -q "\.xcodeproj/"; then
              echo "跳过 $f：里面没有 .xcodeproj"
              continue
            fi
            rm -rf /tmp/srcchk && mkdir -p /tmp/srcchk
            unzip -q -o "$f" -d /tmp/srcchk
            CV=$(find /tmp/srcchk -name "ContentView.swift" | head -1)
            if grep -q "融合版 v20.0" "$CV" 2>/dev/null \
               && grep -q "防封工具箱" "$CV" 2>/dev/null \
               && grep -q "enum LSGuard" "$CV" 2>/dev/null \
               && grep -q "antiBanCard" "$CV" 2>/dev/null; then
              ZIP="$f"
              break
            fi
            echo "跳过 $f：这是旧代码（没有 v20 的融合首页 / 防封模块），不拿它编译"
          done

          if [ -z "$ZIP" ]; then
            echo "::error::根目录里没有可用的 v20 源码包。请只把 LSPakManager-Source-v20.0.zip 原样传到根目录，旧的 zip 全删掉"
            exit 1
          fi

          echo ">>> 本次使用的源码包：$ZIP"
          echo "zip_name=$ZIP" >> "$GITHUB_OUTPUT"

          rm -rf /tmp/srcchk && mkdir -p /tmp/srcchk
          unzip -q -o "$ZIP" -d /tmp/srcchk
          cp -R /tmp/srcchk/. .

          VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" ThreeOneOSFive/Info.plist 2>/dev/null || echo "?")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" ThreeOneOSFive/Info.plist 2>/dev/null || echo "?")
          echo ">>> 准备编译的版本：$VER ($BUILD)"
          echo "app_version=$VER" >> "$GITHUB_OUTPUT"
          echo "app_build=$BUILD" >> "$GITHUB_OUTPUT"

      - name: 融合自检
        shell: bash
        run: |
          set -e
          CV=$(find . -name "ContentView.swift" -not -path "./dd/*" | head -1)
          echo "首页文件：$CV"
          for k in "融合版 v20.0" "防封工具箱" "防封模式" "enum LSGuard" "antiBanCard" "toolboxCard" "LSChamferShape"; do
            if grep -q "$k" "$CV"; then
              echo "  ✓ 有 $k"
            else
              echo "::error::首页里缺 $k，包不对"
              exit 1
            fi
          done
          grep -n "CFBundleDisplayName" -A1 ThreeOneOSFive/Info.plist | head -4
          echo "包标识："
          grep -m2 "PRODUCT_BUNDLE_IDENTIFIER" ThreeOneOSFive.xcodeproj/project.pbxproj

      - name: 定位工程
        id: locate
        shell: bash
        run: |
          set -e
          PROJ=$(find . -maxdepth 3 -name "ThreeOneOSFive.xcodeproj" -type d | head -1)
          if [ -z "$PROJ" ]; then
            PROJ=$(find . -maxdepth 3 -name "*.xcodeproj" -type d | head -1)
          fi
          if [ -z "$PROJ" ]; then
            echo "::error::没找到 .xcodeproj"
            exit 1
          fi
          echo "project=$PROJ" >> "$GITHUB_OUTPUT"
          echo "工程: $PROJ"
          xcodebuild -version
          xcodebuild -project "$PROJ" -list 2>&1 || true

      - name: 编译（不签名）
        shell: bash
        run: |
          set -o pipefail
          PROJ="${{ steps.locate.outputs.project }}"
          LIST=$(xcodebuild -project "$PROJ" -list 2>&1 || true)
          SCHEME=$(echo "$LIST" | awk '/Schemes:/{f=1;next} /Targets:/{f=0} f&&NF{print $1; exit}')
          TARGET=$(echo "$LIST" | awk '/Targets:/{f=1;next} /Build Configurations:/{f=0} f&&NF{print $1; exit}')
          [ -z "$TARGET" ] && TARGET="ThreeOneOSFive"
          echo "Scheme=[$SCHEME] Target=[$TARGET]"

          COMMON=(
            -project "$PROJ"
            -configuration Release
            -sdk iphoneos
            -derivedDataPath "$PWD/dd"
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGN_IDENTITY=""
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO
            GCC_TREAT_WARNINGS_AS_ERRORS=NO
          )

          set +e
          if [ -n "$SCHEME" ]; then
            echo ">>> 用 scheme 编译: $SCHEME"
            xcodebuild "${COMMON[@]}" -scheme "$SCHEME" build 2>&1 | tee build.log
            STATUS=${PIPESTATUS[0]}
            if [ "$STATUS" -ne 0 ] && grep -q "does not contain a scheme" build.log; then
              echo ">>> scheme 没认到，改用 target 编译"
              xcodebuild "${COMMON[@]}" -target "$TARGET" build 2>&1 | tee build.log
              STATUS=${PIPESTATUS[0]}
            fi
          else
            echo ">>> 没有 scheme，用 target 编译: $TARGET"
            xcodebuild "${COMMON[@]}" -target "$TARGET" build 2>&1 | tee build.log
            STATUS=${PIPESTATUS[0]}
          fi

          if [ "$STATUS" -ne 0 ]; then
            echo ""
            echo "=========== 失败信息 ==========="
            echo "源码包: ${{ steps.pick.outputs.zip_name }}"
            echo "报错条数: $(grep -c -i 'error:' build.log || true)"
            echo ""
            echo "----- error: 全部行 -----"
            grep -n -i "error:" build.log | head -80 || true
            echo ""
            echo "----- error: 上下文 -----"
            grep -n -i -B6 -A12 "error:" build.log | head -300 || true
            echo ""
            echo "----- 失败的命令 -----"
            sed -n '/The following build commands failed/,/failures)/p' build.log | head -40 || true
            echo "=============================================="
            echo "::error::编译失败，把上面 error: 那几行发给我"
            exit 1
          fi
          echo ">>> 编译通过"

      - name: 失败时上传编译日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: 打 unsigned IPA
        id: pack
        shell: bash
        run: |
          set -e
          APP=$(find "$PWD/dd/Build/Products" -maxdepth 2 -name "*.app" -type d | head -1)
          echo "APP=$APP"
          if [ -z "$APP" ]; then echo "::error::没找到 .app"; exit 1; fi
          NAME=$(basename "$APP" .app)
          IPA="langshen-v20.0-unsigned.ipa"
          rm -rf build && mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable $NAME" "build/Payload/$(basename "$APP")/Info.plist" || true
          cd build
          /usr/bin/zip -qry "$IPA" Payload
          rm -rf Payload
          ls -lh "$IPA"

      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: langshen-v20.0-unsigned
          path: build/langshen-v20.0-unsigned.ipa
          if-no-files-found: error

      - name: 输出直链
        shell: bash
        run: |
          echo "✅ 编好了，在本页最下面 Artifacts"
          echo "源码包: ${{ steps.pick.outputs.zip_name }}"
          echo "版本:   ${{ steps.pick.outputs.app_version }} (${{ steps.pick.outputs.app_build }})"
          echo "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
